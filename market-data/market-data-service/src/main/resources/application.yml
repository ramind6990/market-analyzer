server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: market-data-service

  datasource:
    # reWriteBatchedInserts lets the PostgreSQL driver turn JDBC batches into multi-row inserts
    url: ${DB_URL:jdbc:postgresql://localhost:5495/trading?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading_pass}

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9892}   # .infra compose: EXTERNAL listener for the host
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:                     # candles-derived (from the Flink aggregator); used in kafka mode only
      group-id: ${KAFKA_GROUP_ID:market-data-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      # Batches for the derived-candle listener: the broker answers once ~20+ messages (8 KB) are waiting
      # or after 1 s, whichever comes first; at most 500 records per batch (one upsert statement each).
      fetch-min-size: 8KB
      fetch-max-wait: 1s
      max-poll-records: 500

market-data:
  kafka:
    mode: ${MARKET_DATA_KAFKA_MODE:kafka}  # kafka = real Kafka (publish, consume candles-derived, create topics),
                                  # logging = no broker: only log what would be published
    topics:
      m1-live: m1-live            # live M1 (ingestion -> Flink)
      m1-reconciled: m1-reconciled  # M1 written by reconciliation (-> Flink)
      h1-reconciled: h1-reconciled  # H1 written by reconciliation (-> Flink H1 stage)
      candles-derived: candles-derived  # progressive M5..D1 (Flink -> this service)
      partitions: 3               # for topics created by the service
      replicas: 1
  reconciliation:
    retention-safety-margin: 1h   # keep jobs away from the retention edge
    max-window-candles: 15       # max span of one job window when packing nearby gaps
    schedule-interval: 5m         # pause between periodic registration runs
    fetch-chunk-candles: 500      # max candles per job execution (one REST call)
    max-attempts: 5               # failed executions before a job is FAILED
    retry-backoff: 1m             # wait before retry; doubles per attempt, max 1h
    recent-window: 1h             # job windows ending within this of now are executed first
    worker:
      threads: 3                  # concurrent executions; the shared rate limit bounds throughput
      claim-batch-size: 10        # jobs claimed at once when the queue runs low (<= requests-per-minute)
      idle-poll-interval: 5s      # sleep when no job is due
      requests-per-minute: 35     # shared budget of REST calls per minute (Nobitex ~60/min)
    timeframes:
      M1:
        retention: 7d             # how long the exchange keeps M1 candles (Nobitex: 7 days)
      H1:
        retention: 30d            # first-run lookback (deeper H1 history comes from the separate script)
        grid-offset: 30m          # Nobitex hours start at :30 UTC
  ingestion:
    exchange-type: CRYPTO_NOBITEX
    base-url: https://apiv2.nobitex.ir
    websocket-url: wss://ws.nobitex.ir/connection/websocket
    user-agent: TraderBot/rm-trading-0.0.1
    stream: mock-clock            # live = exchange WebSocket, mock = generated candles (fast, simulated time),
                                 # mock-clock = generated candles following the real clock (like the WebSocket),
                                 # mock-gaps = 100 candles/symbol from 8 h ago with 3-4 gaps (reconciliation test)
    mock-stream:
      emit-interval: 1s          # one simulated minute per second and symbol
      seed: 42
    worker:
      min-pool-size: 1
      max-pool-size: 5
      queue-capacity: 10000
      keep-alive: 60s
    symbols:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
