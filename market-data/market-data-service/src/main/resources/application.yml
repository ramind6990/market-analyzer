server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: market-data-service

  datasource:
    # reWriteBatchedInserts lets the PostgreSQL driver turn JDBC batches into multi-row inserts
    url: ${DB_URL:jdbc:postgresql://localhost:5495/trading?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading_pass}

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

market-data:
  reconciliation:
    m1-retention: 7d              # how long the exchange keeps M1 candles (Nobitex: 7 days)
    retention-safety-margin: 1h   # keep jobs away from the retention edge
    max-window-candles: 500       # max span of one job window when packing nearby gaps
  ingestion:
    exchange-type: CRYPTO_NOBITEX
    base-url: https://apiv2.nobitex.ir
    websocket-url: wss://ws.nobitex.ir/connection/websocket
    user-agent: TraderBot/rm-trading-0.0.1
    topic: m1-live
    stream: mock                 # live = exchange WebSocket, mock = generated candles
    mock-stream:
      emit-interval: 1s          # one simulated minute per second and symbol
      seed: 42
    publisher: logging           # kafka = real Kafka, logging = only log what would be sent
    worker:
      min-pool-size: 1
      max-pool-size: 5
      queue-capacity: 10000
      keep-alive: 60s
    symbols:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
