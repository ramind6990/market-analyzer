server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: market-analysis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9892}   # .infra compose: EXTERNAL listener for the host
    consumer:
      group-id: ${KAFKA_GROUP_ID:market-analysis}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest

market-analysis:
  kafka:
    topics:
      candle-series-tracking: candle-series-tracking  # complete-history changes per series (market-data-service ->)
