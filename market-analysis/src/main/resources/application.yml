server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: market-analysis

  datasource:
    # same database as market-data-service: reads its "candle" table, owns schema "analysis"
    url: ${DB_URL:jdbc:postgresql://localhost:5495/trading?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading_pass}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: analysis            # own schema + own history table; never touches market-data's migrations
    default-schema: analysis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9892}
    consumer:
      group-id: ${KAFKA_GROUP_ID:market-analysis}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

market-analysis:
  kafka:
    topics:
      candle-series-tracking: candle-series-tracking        # complete-history changes per series (market-data-service ->)
      series-indicators-updated: series-indicators-updated  # indicator rows stored per series (-> strategy)
      partitions: 3
      replicas: 1
  job:
    threads: ${ANALYSIS_JOB_THREADS:0}   # 0 = number of CPU cores
    initial-bars: 1000                   # rows produced by the first (unseeded) computation of a series, after warmup
    max-new-bars: 5000                   # cap of bars computed by one seeded job; the rest follows on the next trigger
