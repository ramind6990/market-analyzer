
name: market-analyzer-messaging

services:
  ############### Init: fix bind-mount ownership #########
  # Docker creates missing bind-mount dirs as root, regardless of a service's `user:`.
  # This one-shot container runs as root, creates the dirs and hands them to the right users,
  # before Kafka / Flink start.
  data-init:
    image: flink:2.2.1-java21
    container_name: market-analyzer-data-init
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/kafka \
                 /data/flink/target /data/flink/flink-checkpoints /data/flink/flink-savepoints \
                 /data/flink/flink-logs /data/flink/flink-rocksdb
        # Writable copy of the image's conf dir per Flink service. The entrypoint applies
        # FLINK_PROPERTIES by rewriting conf/config.yaml, which a non-'flink' user can't do
        # in the image's own /opt/flink/conf. Re-copied on every start, so config stays clean.
        for svc in jobmanager taskmanager; do
          rm -rf /data/flink/conf-$$svc
          cp -r /opt/flink/conf /data/flink/conf-$$svc
        done
        chown -R ${DOCKER_FLINK_UID:-1}:${DOCKER_FLINK_GID:-1} /data/flink
        # apache/kafka image runs as appuser (uid/gid 1000)
        chown -R 1000:1000 /data/kafka
    volumes:
      - ./data:/data
    restart: "no"

  ############### Kafka #########
  market-analyzer-kafka:
    image: apache/kafka:4.4.0
    container_name: market-analyzer-kafka
    depends_on:
      data-init:
        condition: service_completed_successfully
    hostname: market-analyzer-kafka
    ports:
      - "9892:9892"   # host (IntelliJ) -> EXTERNAL listener
    environment:
      KAFKA_NODE_ID: 1

      # KRaft configuration
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@market-analyzer-kafka:9093

      # Listeners
      #   INTERNAL  -> other containers (Flink) and in-container CLI: market-analyzer-kafka:9092 / localhost:9092
      #   EXTERNAL  -> host machine (IntelliJ):                        localhost:9892
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9892,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://market-analyzer-kafka:9092,EXTERNAL://localhost:9892
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Storage
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # Single-node settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - ./data/kafka:/tmp/kraft-combined-logs
    restart: unless-stopped

  ########## Flink ##############
  flink-jobmanager:
    user: "${DOCKER_FLINK_UID:-1}:${DOCKER_FLINK_GID:-1}"
    image: flink:2.2.1-java21
    container_name: flink_jobmanager
    depends_on:
      data-init:
        condition: service_completed_successfully
    ports:
      - "8381:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        parallelism.default: 2
        state.backend.type: rocksdb
        state.backend.rocksdb.localdir: /opt/flink/rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 10min
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
    volumes:
      - ./data/flink/conf-jobmanager:/opt/flink/conf
      - ./data/flink/target:/opt/flink/usrlib:ro
      - ./data/flink/flink-checkpoints:/opt/flink/checkpoints
      - ./data/flink/flink-savepoints:/opt/flink/savepoints
      - ./data/flink/flink-logs:/opt/flink/log
    restart: unless-stopped

  flink-taskmanager:
    user: "${DOCKER_FLINK_UID:-1}:${DOCKER_FLINK_GID:-1}"
    image: flink:2.2.1-java21
    container_name: flink_taskmanager
    depends_on:
      data-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2048m
        state.backend.type: rocksdb
        state.backend.rocksdb.localdir: /opt/flink/rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./data/flink/conf-taskmanager:/opt/flink/conf
      - ./data/flink/flink-rocksdb:/opt/flink/rocksdb
      - ./data/flink/flink-checkpoints:/opt/flink/checkpoints
      - ./data/flink/flink-savepoints:/opt/flink/savepoints
      - ./data/flink/flink-logs:/opt/flink/log
    restart: unless-stopped
